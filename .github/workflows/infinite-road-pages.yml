name: Deploy Phaser Game to GitHub Pages
# Fullscreen preview refresh: flat-html-v6
# fullscreen-preview-rev: 2

on:
  push:
    branches: [main]
    paths:
      - 'infinite-road/**'
      - '.github/workflows/infinite-road-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install stable dependencies
        working-directory: infinite-road
        run: npm install

      - name: Build stable Phaser game
        working-directory: infinite-road
        run: npm run build

      - name: Checkout fullscreen experiment worktree
        run: |
          git fetch origin fullscreen-experiment
          git worktree add fullscreen-preview origin/fullscreen-experiment

      - name: Install fullscreen experiment dependencies
        working-directory: fullscreen-preview/infinite-road
        run: npm install

      - name: Build fullscreen experiment
        working-directory: fullscreen-preview/infinite-road
        run: npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p pages-root/infinite-road
          mkdir -p pages-root/infinite-road/fullscreen-assets
          cp -R infinite-road/dist/. pages-root/infinite-road/
          cp -R fullscreen-preview/infinite-road/dist/assets/. pages-root/infinite-road/fullscreen-assets/
          cp fullscreen-preview/infinite-road/dist/index.html pages-root/infinite-road/fullscreen.html
          sed -i 's#\./assets/#./fullscreen-assets/#g' pages-root/infinite-road/fullscreen.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
