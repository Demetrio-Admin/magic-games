name: Deploy Phaser Game to GitHub Pages

on:
  push:
    branches: [main, fullscreen-experiment]
    paths:
      - 'infinite-road/**'
      - '.github/workflows/infinite-road-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: infinite-road
        run: npm install

      - name: Build Phaser game
        working-directory: infinite-road
        run: npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p pages-root/infinite-road
          cp -R infinite-road/dist/. pages-root/infinite-road/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
