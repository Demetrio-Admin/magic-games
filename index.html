<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<title>Magic RPG — Project v2.0</title>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>
  <div id="save-indicator" class="save-indicator">Прогресс сохранён</div>

<script>globalThis.__MAGIC_RPG_TEST__=true;</script>
<script src="js/app.js" defer></script>
<script src="js/full-hotfix.js" defer></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./service-worker.js');
      registration.update();
    } catch (error) {
      console.warn(error);
    }
  });
}
</script>
</body>
</html>
