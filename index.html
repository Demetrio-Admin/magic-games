<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08070d">
<link rel="manifest" href="manifest.webmanifest?v=3.1.0">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/nocturne-game.css?v=5.0.1">
<title>Magic RPG — Между светом и тьмой</title>
</head>
<body class="nocturne-clean">
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>
  <div id="save-indicator" class="save-indicator">Прогресс сохранён</div>
<script src="tests/ui-audit-bootstrap.js?v=3.1.4" defer></script>
<script src="js/app.js?v=5.0.1" defer></script>
<script src="js/nocturne-ui.js?v=5.0.1" defer></script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  addEventListener('load',async()=>{
    try{
      if(new URLSearchParams(location.search).has('ui-audit'))return;
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=5.0.1',{updateViaCache:'none'});
      await registration.update();
    }catch(error){console.warn('Service worker registration failed:',error);}
  });
}
</script>
</body>
</html>
