<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<link rel="stylesheet" href="css/design-system-v1.css">
<link rel="stylesheet" href="css/mobile-layout-v1.1.css">
<link rel="stylesheet" href="css/core-screens-v1.css">
<link rel="stylesheet" href="css/investigation-ui-v1.css">
<title>Investigation UI v1 — preview</title>
<style>
html,body{margin:0;background:#050409;color:#f6f1f8;font-family:Inter,system-ui,sans-serif;overflow:hidden}
*{box-sizing:border-box}.preview-switch{position:fixed;z-index:999;right:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:4px}.preview-switch button{min-height:32px;padding:0 8px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:#17131f;color:#eee;font-size:8px}.preview-switch button.active{border-color:#c694e8;background:#332441}
.c2-shell,.c3-shell,.c4-shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:linear-gradient(180deg,#0d0a13,#07060b)}
.c2-top,.c3-top,.c4-top{min-height:64px;padding:max(8px,env(safe-area-inset-top)) 116px 8px 9px;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.12);background:rgba(8,7,13,.95)}
.c2-top button,.c3-top button,.c4-top button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#17131f;color:#fff}.c2-top h1,.c3-top h1,.c4-top h1{margin:0;font:500 17px Georgia,serif}.c2-top small,.c3-top small,.c4-top small{color:#958a9e;font-size:8px}
.c2-main,.c3-main,.c4-main{min-height:0;padding:8px}.c2-footer,.c3-footer,.c4-footer{padding:8px 9px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:7px;border-top:1px solid rgba(255,255,255,.12);background:#09070d}.primary-button,.secondary-button{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.16);color:white;font-weight:800}.primary-button{background:linear-gradient(135deg,#a966d5,#6d4d9b)}.secondary-button{background:#18131f}
.ux-location-tabs,.ux6-tabs,.c4-locations{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.ux-location-tabs button,.ux6-tab,.c4-locations button{border:1px solid rgba(255,255,255,.14);background:#17131f;color:#aaa;border-radius:10px}.active{color:white!important}.ux-scene,.ux6-scene,.c4-invest-scene{position:relative;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 55% 30%,rgba(198,148,232,.24),transparent 30%),linear-gradient(145deg,#30233a,#101019)}.ux-hotspot,.ux6-hotspot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #91b9ec;background:#111827;color:white}.ux-hotspot.selected,.ux6-hotspot.selected{border-color:#e2bb78}.ux-invest-panel,.ux6-point-panel,.ux6-stage-card,.c4-point,.c4-method{border:1px solid rgba(255,255,255,.14);background:#17131f}.ux-invest-head{display:flex;justify-content:space-between}.ux-evidence-strip,.c4-evidence{border-top:1px solid rgba(255,255,255,.1)}.ux-evidence-chip,.ux6-evidence-chip,.c4-evidence-chip{border:1px solid rgba(255,255,255,.14);background:#14111b}.ux-evidence-chip b,.ux6-evidence-chip b,.c4-evidence-chip b{display:block}.ux-evidence-chip span,.ux6-evidence-chip span,.c4-evidence-chip span{color:#958a9e}.ux-point-copy h2,.ux6-point-panel h3{margin:0}.ux-point-copy p,.ux6-point-panel p{color:#aaa}.ux-method,.ux6-method,.c4-method,.ux-hypothesis,.ux6-hypothesis,.c4-choice{width:100%;border:1px solid rgba(255,255,255,.14);background:#211a2b;color:white}.ux-method strong{display:flex;justify-content:space-between}.ux-method span,.ux6-method span,.c4-method span,.ux-hypothesis span,.ux6-hypothesis span,.c4-choice span{display:block;color:#aaa}.ux6-status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.ux6-status-strip div{padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:9px;text-align:center}.ux6-status-strip b,.ux6-status-strip span{display:block}.ux6-status-strip span{font-size:7px;color:#999}.ux6-evidence-box{border:1px solid rgba(255,255,255,.13);border-radius:12px}.ux6-evidence-box summary{padding:8px}.c4-point-list{display:grid;gap:6px}.c4-point{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;text-align:left;color:white;border-radius:12px}.c4-point i{display:grid;place-items:center;background:#26342e;border-radius:10px}.c4-point b,.c4-point small{display:block}.c4-point small{color:#999}.c4-methods{display:grid;gap:6px}.c4-deduction{display:grid;gap:8px}.ux-board-summary,.ux6-deduction-head{border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;background:#17131f}.ux-hypotheses,.ux6-deduction{display:grid;gap:7px}.ux-hypothesis,.ux6-hypothesis,.c4-choice{padding:11px;border-radius:13px;text-align:left}.selected{border-color:#e2bb78!important}.hidden{display:none!important}
</style>
</head>
<body class="design-system-v1 core-screens-v1 investigation-ui-v1">
<nav class="preview-switch" aria-label="Preview modes">
<button data-mode="c2">Гл. 2</button><button data-mode="c3">Гл. 3</button><button data-mode="c4">Гл. 4</button><button data-mode="deduction">Вывод</button>
</nav>
<div id="app"></div>
<script>
const app=document.getElementById('app');
window.__fixtureClicks=0;window.__errors=[];addEventListener('error',e=>window.__errors.push(String(e.error||e.message)));addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));
const templates={
c2:`<div class="c2-shell"><header class="c2-top"><button>‹</button><div><h1>Расследование</h1><small>Глава 2 · Корни памяти</small></div></header><main class="c2-main"><div class="ux-investigation"><section class="ux-scene-wrap"><div class="ux-location-tabs"><button class="active">Квартира</button><button>Лавка</button><button>Двор</button></div><div class="ux-scene apartment"><button class="ux-hotspot" style="left:24%;top:66%" data-point="witness">人</button><button class="ux-hotspot" style="left:70%;top:32%" data-point="photo">▧</button></div></section><section class="ux-invest-panel"><header class="ux-invest-head"><b>Точки интереса</b><span>0 улик · время 7</span></header><div class="ux-point-body"><div class="ux-empty-point">Выберите объект на сцене</div></div><div class="ux-evidence-strip"><div class="ux-evidence-chip"><b>Улик пока нет</b><span>Выберите объект</span></div></div></section></div></main><footer class="c2-footer"><button class="secondary-button">Сбросить</button><button class="primary-button" disabled>Собрать вывод</button></footer></div>`,
c3:`<div class="c3-shell"><header class="c3-top"><button>‹</button><div><h1>Расследование площади</h1><small>Глава 3 · Первый Свет</small></div></header><main class="c3-main"><div class="ux6-status-strip"><div><b>8</b><span>время</span></div><div><b>1</b><span>улики</span></div><div><b>0</b><span>паника</span></div><div><b>0</b><span>тревога</span></div></div><div class="ux6-tabs"><button class="ux6-tab active">Площадь</button><button class="ux6-tab">Архив</button><button class="ux6-tab">Крыша</button></div><div class="ux6-scene square"><button class="ux6-hotspot" style="left:22%;top:69%" data-point="technician" aria-label="Техник Ордена">人</button><button class="ux6-hotspot" style="left:55%;top:36%" data-point="sigil" aria-label="Обгоревшая печать">✦</button><button class="ux6-hotspot done" disabled style="left:79%;top:64%" data-point="courier" aria-label="Напуганный курьер">✓</button></div><section class="ux6-stage-card"><h3>Осмотрите сцену</h3><p>Выберите одну из светящихся точек.</p></section><details class="ux6-evidence-box" open><summary>Найденные улики</summary><div class="ux6-evidence-row"><div class="ux6-evidence-chip ritual"><b>След чужого страха</b><span>Ритуальная</span></div></div></details></main><footer class="c3-footer"><button class="secondary-button">Начать заново</button><button class="primary-button">Собрать выводы</button></footer></div>`,
c4:`<div class="c4-shell"><header class="c4-top"><button>‹</button><div><h1>Проверка партии</h1><small>Глава 4 · Горький рецепт</small></div></header><main class="c4-main"><div class="c4-scroll"><div class="c4-invest"><div><div class="c4-locations"><button class="active">Склад</button><button>Лаборатория</button><button>Теплица</button></div><div class="c4-invest-scene warehouse"><span>Склад поставщика</span></div></div><div class="c4-evidence"><div class="c4-evidence-chip chemical"><b>Двойная колба</b><span>Химическая</span></div></div><div><div class="c4-point-list"><button class="c4-point selected"><i>▣</i><div><b>Ящик с лунной водой</b><small>Пломба цела, но запах слишком резкий.</small></div><em>Выбрано</em></button><button class="c4-point"><i>≡</i><div><b>Накладная</b><small>Номер партии исправлен вручную.</small></div><em>Выбрать</em></button></div><div class="c4-methods"><button class="c4-method"><b>Поиск</b><span>Сравнить магический след с рецептом.</span><em>−1 времени</em></button><button class="c4-method"><b>Телекинез</b><span>Отделить внутреннюю колбу.</span><em>−1 времени</em></button></div></div></div></div></main><footer class="c4-footer"><button class="secondary-button">Сохранить</button><button class="primary-button">Сделать вывод</button></footer></div>`,
deduction:`<div class="c2-shell"><header class="c2-top"><button>‹</button><div><h1>Доска выводов</h1><small>Улики не дают ответ автоматически</small></div></header><main class="c2-main"><div class="ux-deduction"><section class="ux-board-summary"><h2>Что удерживает Памятный плющ?</h2><p>Выберите версию, которую подтверждают найденные следы.</p></section><div class="ux-board-scroll"><div class="ux-clue-board"><div class="ux-clue-card"><b>Связь заколки</b><small>Удерживает невыполненное обещание.</small></div></div><div class="ux-hypotheses"><button class="ux-hypothesis"><b>Незавершённое обещание</b><span>Три предмета являются опорами памяти.</span></button><button class="ux-hypothesis"><b>Паразит в земле</b><span>Растение стало самостоятельной угрозой.</span></button></div></div></div></main><footer class="c2-footer"><button class="secondary-button">Вернуться</button><button class="primary-button" disabled>Проверить гипотезу</button></footer></div>`
};
function render(mode){app.innerHTML=templates[mode]||templates.c2;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));try{history.replaceState(null,'',`?mode=${mode}`)}catch(_){/* about:blank test preview */}}
const mode=window.__TEST_MODE||new URLSearchParams(location.search).get('mode')||'c2';render(mode);
document.querySelector('.preview-switch').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)render(b.dataset.mode)});
app.addEventListener('click',e=>{
 const hot=e.target.closest('.ux-hotspot,.ux6-hotspot');
 if(hot&&!hot.disabled){window.__fixtureClicks++;hot.closest('.ux-scene,.ux6-scene').querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));hot.classList.add('selected');const c2=hot.closest('.c2-shell');const c3=hot.closest('.c3-shell');if(c2){const body=c2.querySelector('.ux-point-body');body.innerHTML='<div class="ux-point-copy"><h2>'+hot.getAttribute('aria-label')+'</h2><p>Описание выбранного объекта.</p></div><div class="ux-methods"><button class="ux-method"><strong><span>Изучить Поиском</span><em>−1</em></strong><span>Получить ритуальную улику.</span><small>Результат изменит подготовку.</small></button></div>';}if(c3){const old=c3.querySelector('.ux6-stage-card,.ux6-point-panel');old.outerHTML='<section class="ux6-point-panel"><h3>'+hot.getAttribute('aria-label')+'</h3><p>Описание выбранного объекта.</p><div class="ux6-methods"><button class="ux6-method"><b>Применить Поиск</b><span>Получить улику.</span><em>−1 времени</em></button></div></section>';}}
 const hyp=e.target.closest('.ux-hypothesis');if(hyp){document.querySelectorAll('.ux-hypothesis.selected').forEach(x=>x.classList.remove('selected'));hyp.classList.add('selected');document.querySelector('.c2-footer .primary-button').disabled=false;}
});
</script>
<script src="js/investigation-ui-v1.js"></script>
</body>
</html>
