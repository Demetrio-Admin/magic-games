<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Battle UI v1 Fixture</title>
<link rel="stylesheet" href="css/design-system-v1.css">
<link rel="stylesheet" href="css/mobile-layout-v1.1.css">
<link rel="stylesheet" href="css/core-screens-v1.css">
<link rel="stylesheet" href="css/investigation-ui-v1.css">
<link rel="stylesheet" href="css/battle-ui-v1.css">
<style>
:root{--app-height:100vh;--line:rgba(231,216,241,.17);--text:#f6f1f8;--muted:#aaa0b3;--green:#8fd0ac;--red:#df91a2;--blue:#8fb7e8;--amber:#e3bd7f;--violet-bright:#d8a8f2;--shadow:0 16px 42px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;background:#050409;color:var(--text);font-family:system-ui,sans-serif}button{font:inherit;color:inherit}.hidden{display:none!important}#app{width:min(100%,520px);height:100vh;margin:auto;background:#09070d;overflow:hidden}
.c2-shell,.inc-shell,.c3-shell,.c4-shell{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.c2-top,.inc-top,.c3-top,.c4-top{min-height:62px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 9px;border-bottom:1px solid var(--line);background:#0b0910}.c2-top h1,.inc-top h1,.c3-top h1,.c4-top h1{font-size:17px;margin:0}.c2-top small,.inc-top small,.c3-top small,.c4-top small{font-size:8px;color:var(--muted)}.c2-main,.inc-main,.c3-main,.c4-main{min-height:0;overflow:auto;padding:8px}.c2-footer,.inc-footer,.c3-footer,.c4-footer{padding:8px;border-top:1px solid var(--line);background:#09070d}.secondary-button,.primary-button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#17121f;padding:0 14px}.primary-button{background:#7952a0}
.c2-battle,.inc-battle,.ux6-battle-layout,.c4-battle{display:grid;gap:7px}.c2-ritual,.inc-ritual,.c3-objective,.c4-objective,.c2-enemy,.inc-enemy,.c3-arena,.c4-enemy,.c2-action-panel,.inc-actions-wrap,.c4-action-panel{border:1px solid var(--line);border-radius:14px;padding:9px;background:#17121f}.c2-ritual-grid,.inc-ritual-list,.c3-objective-list,.c4-objective-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.c2-ritual-grid>div,.inc-ritual-list>div,.c3-objective-step,.c4-objective-grid>div{position:relative;padding-left:16px;font-size:8px;color:var(--muted)}.c2-ritual-grid>div:before,.inc-ritual-list>div:before,.c3-objective-step:before,.c4-objective-grid>div:before{content:'○';position:absolute;left:0}.done:before{content:'✓'!important}.done{color:var(--green)!important}.fail{color:var(--red)!important}.c2-intent,.inc-intent,.c3-intent,.c4-intent{padding:8px;border-left:3px solid var(--red);background:#291820;border-radius:10px}.c2-statuses,.inc-stats,.c3-statuses,.c4-statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.c2-statuses span,.inc-stats span,.c3-chip,.c4-statuses span{border:1px solid var(--line);padding:5px;text-align:center;font-size:7px}.c2-statuses b,.inc-stats b,.c4-statuses b{display:block}.c2-roots,.inc-links{display:flex;gap:5px;margin-top:6px}.c2-root,.inc-link{flex:1;min-height:42px;border:1px solid var(--line);border-radius:9px;background:#12131a}.c2-team,.inc-party,.c3-units,.c4-team,.c2-battle-tabs,.c3-battle-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.c2-battle-tabs{grid-template-columns:repeat(2,1fr)}.c2-team>* , .inc-party>*,.c3-unit,.c4-team>*,.c2-battle-tabs>*,.c3-battle-tab{border:1px solid var(--line);border-radius:10px;background:#15121b;padding:7px}.active,.v112-active{border-color:var(--blue)!important}.c2-actions,.inc-actions,.c3-actions,.c4-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.c2-action,.inc-action,.c3-action,.c4-action{min-height:64px;border:1px solid var(--line);border-radius:11px;background:#211929;padding:8px;text-align:left}.c2-action b,.inc-action b,.c3-action b,.c4-action b{display:block}.c2-action span,.inc-action span,.c3-action span,.c4-action span{display:block;font-size:8px;color:var(--muted)}.c2-action em,.inc-action em,.c4-action em{font-size:7px;color:var(--blue)}.c3-arena{min-height:170px}.c3-log{padding:8px;border:1px solid var(--line);border-radius:10px;font-size:8px}.c4-targets{display:flex;gap:6px}.c4-target{flex:1}.c4-dots{display:flex;gap:3px}.c4-dots i{width:8px;height:8px;border-radius:50%;background:#444}.c4-dots i.on{background:var(--green)}
</style></head><body><div id="app"></div><script>
window.__errors=[];window.addEventListener('error',e=>window.__errors.push(e.message));window.__fixtureClicks=0;
function shellTop(cls,title){return `<header class="${cls}-top"><button>‹</button><div><h1>${title}</h1><small>Раунд 2</small></div><span>✦ 2</span></header>`}
function objective(cls,items){return `<section class="${cls}"><div><b>Ритуальная цель</b></div><div class="${cls==='c2-ritual'?'c2-ritual-grid':cls==='inc-ritual'?'inc-ritual-list':cls==='c3-objective'?'c3-objective-list':'c4-objective-grid'}">${items.map((x,i)=>`<div class="${i<2?'done':''}">${x}</div>`).join('')}</div>${cls==='c2-ritual'?'<p><b>Дальше:</b> Наложите Печать и завершите Очищением.</p>':''}</section>`}
function action(cls,name,desc,attrs='',disabled=false,reason=''){return `<button class="${cls}" ${attrs} ${disabled?'disabled':''}><em>1 действие</em><b>${name}</b><span>${desc}</span>${reason?`<small>${reason}</small>`:''}</button>`}
function c2(){return `<div class="c2-shell">${shellTop('c2','Памятный плющ')}<main class="c2-main"><div class="c2-battle">${objective('c2-ritual',['Покров снят','Связи разрушены','Живая Связь','Свидетель'])}<section class="c2-enemy"><h2>Памятный плющ</h2><div class="c2-intent"><span>Намерение</span><b>Сжать корни</b><small>Снимет Стойкость свидетеля</small></div><div class="c2-statuses"><span><b>0/3</b>Покров</span><span><b>2/3</b>Связи</span><span><b>0/3</b>Скверна</span></div><div class="c2-roots"><button class="c2-root selectable"><b>✦</b>Фото</button><button class="c2-root"><b>?</b>Земля</button></div></section><section class="c2-team"><div><strong>Герой</strong></div><button class="target"><strong>Морвен</strong></button><button class="target"><strong>Свидетель</strong></button></section><section class="c2-action-panel"><div class="c2-action-head"><b>Заклинания героя</b><span>Герой 2/2 · Команда 1/1 · Резонанс 4/6</span></div><div class="c2-actions">${action('c2-action','Поиск','Раскрыть Связь','data-action="chapter2-battle-action" data-battle-action="search"')}${action('c2-action','Телекинез','Разрушить корень','data-action="chapter2-battle-action" data-battle-action="tele"')}${action('c2-action finish','Очищение I','Завершить ритуал','data-action="chapter2-battle-action" data-battle-action="purify"',true,'Наложите Печать.')}</div></section></div></main><footer class="c2-footer"><div class="c2-battle-tabs"><button class="active" data-tab="hero">Герой</button><button data-tab="morven">Морвен</button></div><button class="secondary-button" data-action="chapter2-end-turn">Завершить раунд</button></footer></div>`}
function incident(){return `<div class="inc-shell">${shellTop('inc','Ритуал на остановке')}<main class="inc-main"><div class="inc-battle">${objective('inc-ritual',['Обе Связи раскрыты','Покров снят','Смесь применена','Свидетель в сознании'])}<section class="inc-intent"><span>Намерение</span><b>Шёпот корней</b><small>Атакует свидетеля</small></section><section class="inc-enemy"><h2>Говорящие астры</h2><div class="inc-stats"><span>Покров<b>0</b></span><span>Свидетель<b>3</b></span><span>Резонанс<b>2</b></span></div><div class="inc-links"><button class="inc-link selectable"><b>Букет</b>активна</button><button class="inc-link"><b>Фраза</b>активна</button></div></section><section class="inc-party"><div class="v112-active" data-v112-tab="hero"><strong>Герой</strong><small>2 действия</small></div><div data-v112-tab="morven"><strong>Морвен</strong><small>готов</small></div><div data-v112-tab="companion"><strong>Лиора</strong><small>готова</small></div></section><section class="inc-actions-wrap"><div class="inc-actions-head"><b>Действия героя</b></div><div class="inc-actions">${action('inc-action','Поиск','Раскрыть Связь','data-action="incident-battle-action"')}${action('inc-action','Телекинез','Разорвать Связь','data-action="incident-battle-action"')}${action('inc-action finish','Очищение','Завершить ритуал','data-action="incident-final"',true,'Сначала примените смесь.')}</div></section></div></main><footer class="inc-footer"><button class="secondary-button" data-action="incident-end-turn">Завершить ход</button></footer></div>`}
function c3(){return `<div class="c3-shell">${shellTop('c3','Защита маяка')}<main class="c3-main"><div class="ux6-battle-layout">${objective('c3-objective',['Источник раскрыт','Покров снят','Печать наложена','Цели целы'])}<div class="c3-intent"><small>Намерение раскрыто</small><b>Удар по маяку</b><span>Снимет устойчивость</span></div><div class="c3-arena"><div class="c3-statuses"><span class="c3-chip bad">Покров 0</span><span class="c3-chip good">Источник найден</span><span class="c3-chip bad">Печать 0</span></div></div><div class="c3-units"><div class="c3-unit active"><b>Герой</b><span>2 действия</span></div><div class="c3-unit"><b>Лиора</b><span>Стойкость 3</span></div><div class="c3-unit"><b>Морвен</b><span>Команда готова</span></div></div><div class="c3-battle-tabs"><button class="c3-battle-tab active">Герой</button><button class="c3-battle-tab">Лиора</button><button class="c3-battle-tab">Морвен</button></div><div class="c3-actions">${action('c3-action','Поиск','Раскрыть Источник','data-action="c3-battle-action" data-battle-action="search"')}${action('c3-action','Печать','Закрепить Источник','data-action="c3-battle-action" data-battle-action="seal"')}${action('c3-action res','Изгнание','Завершить ритуал','data-action="c3-battle-action" data-battle-action="banish"',true,'Наложите Печать.')}</div><div class="c3-log">Последние события боя</div></div></main><footer class="c3-footer"><button class="secondary-button" data-action="c3-end-turn">Завершить раунд</button></footer></div>`}
function c4(){return `<div class="c4-shell">${shellTop('c4','Алхимический голод')}<main class="c4-main"><div class="c4-scroll"><div class="c4-battle">${objective('c4-objective',['Ядро раскрыто','Покров снят','Печать 2/2','Доза сохранена'])}<section class="c4-enemy"><h2>Зеркальный осадок</h2><div class="c4-intent"><b>Стереть воспоминание</b><span>Ударит по пациентке</span></div><div class="c4-statuses"><span><b>0</b>Покров</span><span><b>да</b>Ядро</span><span><b>1/2</b>Печать</span></div><div class="c4-targets"><div class="c4-target"><b>Пациентка</b><div class="c4-dots"><i class="on"></i><i class="on"></i></div></div><div class="c4-target"><b>Лаборатория</b><div class="c4-dots"><i class="on"></i><i class="on"></i></div></div></div></section><div class="c4-team"><button class="active"><b>Герой</b><span>2 действия</span></button><button><b>Селеста</b><span>готова</span></button><button><b>Лиора</b><span>готова</span></button></div><section class="c4-action-panel"><div class="c4-action-head"><b>Действия героя</b><span>доз 1</span></div><div class="c4-actions">${action('c4-action','Поиск','Раскрыть ядро','data-action="c4-battle-action" data-value="search"')}${action('c4-action','Печать','Закрепить ядро','data-action="c4-battle-action" data-value="seal"')}${action('c4-action finish','Очищение','Завершить ритуал','data-action="c4-battle-action" data-value="purify"',true,'Наложите Печать: 1/2.')}</div></section></div></div></main><footer class="c4-footer"><button class="secondary-button" data-action="c4-end-turn">Завершить раунд</button></footer></div>`}
function wire(){document.querySelectorAll('button,[data-v112-tab]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;window.__fixtureClicks++;if(b.closest('.c2-battle-tabs,.c3-battle-tabs,.c4-team')){const host=b.parentElement;[...host.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');const units=document.querySelectorAll('.c3-unit');if(host.classList.contains('c3-battle-tabs'))units.forEach((x,i)=>x.classList.toggle('active',host.children[i]===b));}if(b.closest('.inc-party')){[...b.parentElement.children].forEach(x=>x.classList.remove('v112-active'));b.classList.add('v112-active');}}))}
window.render=mode=>{document.getElementById('app').innerHTML=({c2:c2(),incident:incident(),c3:c3(),c4:c4()})[mode];wire()};render('c2');
</script><script src="js/battle-ui-v1.js"></script></body></html>
