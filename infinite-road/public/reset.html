<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071516" />
  <title>Сброс кэша — Повелитель Тайн</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#071516;color:#d2d6d4;font-family:system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="status">Очищаю старую версию игры…</div>
  <script>
    (async () => {
      const el = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        el.textContent = 'Готово. Перезапускаю игру…';
        setTimeout(() => location.replace('./?reset=' + Date.now()), 250);
      } catch (e) {
        el.textContent = 'Не удалось очистить автоматически. Закрой вкладку и открой игру снова.';
      }
    })();
  </script>
</body>
</html>
