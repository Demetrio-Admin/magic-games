<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071516" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Повелитель Тайн — Stage 6 Phaser</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071516; }
      body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      canvas { display: block; margin: 0 auto; }
      #boot-status {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        box-sizing: border-box; padding: 24px; background: #071516; color: #aab6af; text-align: center; font-size: 14px;
      }
      #boot-status.error { color: #f0b3a3; white-space: pre-wrap; }
    </style>
    <script>
      (function () {
        function statusEl() { return document.getElementById('boot-status'); }
        function hideStatusIfCanvasExists() {
          var app = document.getElementById('app');
          var status = statusEl();
          if (app && status && app.querySelector('canvas')) {
            status.remove();
            return true;
          }
          return false;
        }

        window.addEventListener('error', function (event) {
          var status = statusEl();
          if (!status) return;
          status.className = 'error';
          status.textContent = 'Ошибка запуска Phaser:\n' + (event.message || 'неизвестная ошибка');
        });

        window.addEventListener('unhandledrejection', function (event) {
          var status = statusEl();
          if (!status) return;
          status.className = 'error';
          status.textContent = 'Ошибка запуска Phaser:\n' + String(event.reason || 'неизвестная ошибка');
        });

        window.addEventListener('DOMContentLoaded', function () {
          if (hideStatusIfCanvasExists()) return;

          var app = document.getElementById('app');
          if (!app) return;

          var observer = new MutationObserver(function () {
            if (hideStatusIfCanvasExists()) observer.disconnect();
          });
          observer.observe(app, { childList: true, subtree: true });

          // Safety fallback in case Phaser inserted canvas before observer setup.
          setTimeout(function () {
            if (hideStatusIfCanvasExists()) observer.disconnect();
          }, 50);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-status">Запускаю Phaser 4…</div>
  </body>
</html>
